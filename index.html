<style>/* 00_base.css */
/* Theme tokens are set on :root by src/kernel/01_themes.js. These are the Labs Night fallbacks. */
:root {

}
* { box-sizing: border-box; }

/* ---------- UI kit for apps (see API.md) ---------- */
.ui-btn {

  background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;

.ui-input, .ui-select, .ui-textarea {

}
.ui-tag { border-radius: 4px; }
.ui-chip.good, .ui-tag.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }

.ui-chip.warn, .ui-tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }

.ui-kbd {
  display: inline-block; padding: 0 5px; min-width: 18px; text-align: center; border-radius: 4px; font-size: 11px;

}
.ui-panel { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 10px; }
.ui-title { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.ui-muted { color: var(--muted); } .ui-faint { color: var(--faint); }
.ui-good { color: var(--good); } .ui-bad { color: var(--bad); } .ui-warn { color: var(--warn); }
.ui-info { color: var(--info); } .ui-accent { color: var(--accent); } .ui-accent2 { color: var(--accent2); }
.ui-big { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.ui-scroll { overflow: auto; }
.row { display: flex; flex-direction: row; gap: var(--gap); align-items: center; }
.col { display: flex; flex-direction: column; gap: var(--gap); }
.grow { flex: 1 1 auto; min-width: 0; min-height: 0; }
.ui-pad { padding: 10px; }

.ui-table { width: 100%; border-collapse: collapse; font-size: 12px; }

.ui-bar { height: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.ui-bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .25s; }
.ui-bar.good > i { background: var(--good); } .ui-bar.bad > i { background: var(--bad); } .ui-bar.warn > i { background: var(--warn); }

.ui-crash { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(3px); z-index: 5; animation: crash-in .25s ease-out; }
.ui-crash .box { max-width: 560px; width: 100%; border: 2px solid var(--bad); border-radius: var(--radius); background: var(--surface); box-shadow: 0 0 0 4px color-mix(in srgb, var(--bad) 15%, transparent), 0 20px 50px rgba(0,0,0,.45); }
.ui-crash .hd { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: color-mix(in srgb, var(--bad) 18%, var(--surface)); color: var(--bad); font-weight: 800; }
.ui-crash .bd { padding: 12px 14px; }
.ui-crash .code { color: var(--bad); font-weight: 700; margin: 8px 0 4px; }
.ui-crash pre { margin: 6px 0 0; padding: 8px; background: var(--bg); border-radius: 6px; color: var(--muted); font-size: 11px; white-space: pre-wrap; max-height: 160px; overflow: auto; }
.ui-crash .ft { display: flex; justify-content: flex-end; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--border); }
@keyframes crash-in { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }
@keyframes ui-shake { 0%,100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
.ui-shake { animation: ui-shake .35s; }
@keyframes ui-blink { 50% { opacity: 0; } }
.ui-blink { animation: ui-blink 1s steps(1) infinite; }
@keyframes ui-spin { to { transform: rotate(360deg); } }
.ui-spin { display: inline-block; animation: ui-spin 1s linear infinite; }
.icon { display: inline-flex; width: 16px; height: 16px; flex: none; }
.icon svg { width: 100%; height: 100%; }
.pixel { image-rendering: pixelated; image-rendering: crisp-edges; }

/* 10_shell.css */
#os { position: fixed; inset: 0; overflow: hidden; }
#wall { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------- ridgebar ---------- */
#bar {
  position: absolute; top: 0; left: 0; right: 0; height: var(--bar-h); z-index: 40;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px;
  background: var(--bar); backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
  font-size: 12px; user-select: none; transition: transform .4s cubic-bezier(.2,.8,.2,1);
}
#os.booting #bar { transform: translateY(-100%); }
#bar .l, #bar .r { display: flex; align-items: center; gap: 2px; min-width: 0; }
#bar .r { justify-content: flex-end; }
#bar .m { justify-self: center; }
.bm { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px; border-radius: 6px; cursor: pointer; color: var(--fg); white-space: nowrap; border: 0; background: none; }
.bm:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.bm .icon { width: 14px; height: 14px; }
.bm.dim { color: var(--muted); }
.bm.good { color: var(--good); } .bm.bad { color: var(--bad); } .bm.warn { color: var(--warn); }
.bm.logo { padding: 0 6px 0 4px; }
.bm.logo svg { width: 18px; height: 18px; }
.bm.clock { font-weight: 700; }
.ws { display: inline-flex; gap: 2px; margin-left: 4px; }
.ws b { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 5px; color: var(--faint); cursor: pointer; font-weight: 700; font-size: 11px; position: relative; }
.ws b.occ { color: var(--muted); }
.ws b.occ::after { content: ""; position: absolute; bottom: 1px; left: 50%; width: 3px; height: 3px; margin-left: -1.5px; border-radius: 50%; background: currentColor; }
.ws b.cur { color: var(--on-accent); background: linear-gradient(135deg, var(--accent), var(--accent2)); }
.ws b.cur::after { display: none; }
.ws b.urgent { color: var(--bad); }
.spark { display: inline-flex; align-items: flex-end; gap: 1px; height: 12px; }
.spark i { display: block; width: 2px; background: var(--accent); border-radius: 1px; opacity: .85; }
.bricky-tray { width: 18px; height: 18px; }

/* ---------- desk + windows ---------- */
#desk { position: absolute; top: var(--bar-h); left: 0; right: 0; bottom: 0; }
.win {
  position: absolute; display: flex; flex-direction: column; overflow: hidden;
  border: 2px solid transparent; border-radius: var(--radius);
  background: linear-gradient(var(--surface), var(--surface)) padding-box,
              linear-gradient(var(--border), var(--border)) border-box;
  box-shadow: 0 6px 24px rgba(0,0,0,.28);
  transition: left var(--t) cubic-bezier(.2,.8,.2,1), top var(--t) cubic-bezier(.2,.8,.2,1),
              width var(--t) cubic-bezier(.2,.8,.2,1), height var(--t) cubic-bezier(.2,.8,.2,1),
              opacity var(--t), transform var(--t);
}
.win.focused {
  background: linear-gradient(var(--surface), var(--surface)) padding-box,
              linear-gradient(135deg, var(--accent), var(--accent2)) border-box;
  box-shadow: 0 10px 34px rgba(0,0,0,.38);
}
.win.opening { opacity: 0; transform: scale(.96); }
.win.closing { opacity: 0; transform: scale(.94); pointer-events: none; }
.win.floating { z-index: 20; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
.win.floating.focused { z-index: 21; }
.win.hidden { visibility: hidden; pointer-events: none; opacity: 0; }
.win.dragging { transition: none; }
.win.urgent { animation: urgent 1s ease-in-out 3; }
@keyframes urgent { 50% { background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(var(--bad), var(--bad)) border-box; } }
.whd {
  height: 24px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 8px;
  font-size: 11px; color: var(--muted); background: var(--surface2); border-bottom: 1px solid var(--border); user-select: none;
}
.win.focused .whd { color: var(--fg); }
.whd .icon { width: 13px; height: 13px; color: var(--accent); }
.whd .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.whd .meta { color: var(--faint); font-size: 10px; }
.whd button { width: 18px; height: 18px; border-radius: 4px; border: 0; background: none; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1; padding: 0; }
.whd button:hover { background: var(--border); color: var(--fg); }
.whd button.x:hover { background: var(--bad); color: var(--on-accent); }
.win.floating .whd { cursor: move; }
.wbd { position: relative; flex: 1; min-height: 0; overflow: auto; }

/* Empty workspace */
#empty { position: absolute; top: var(--bar-h); left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); pointer-events: none; text-align: center; transition: opacity .3s; }
#empty.off { opacity: 0; }
#empty img { width: 96px; height: 96px; filter: drop-shadow(0 8px 16px rgba(0,0,0,.35)); }
#empty .hint { font-size: 12px; line-height: 1.9; background: color-mix(in srgb, var(--bg) 70%, transparent); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); }
#empty .say { color: var(--fg); font-weight: 700; }

/* ---------- notifications (mortar) ---------- */
#notes { position: absolute; top: calc(var(--bar-h) + 8px); right: 10px; width: 340px; max-width: calc(100vw - 20px); z-index: 60; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.note {
  pointer-events: auto; display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 10px 12px;
  background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(8px);
  border: 2px solid var(--border); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,.35);
  cursor: pointer; animation: note-in .28s cubic-bezier(.2,.8,.2,1); position: relative; overflow: hidden;
}
.note.normal { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); }
.note.critical { border-color: var(--bad); }

.note .av { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; color: var(--accent); }

/* ---------- overlays ---------- */
#overlay > * { position: absolute; inset: 0; z-index: 80; }
.scrim { background: rgba(0,0,0,.35); display: flex; justify-content: center; align-items: flex-start; padding-top: 14vh; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.pal {
  width: 600px; max-width: calc(100vw - 32px); background: var(--surface); border: 2px solid transparent; border-radius: 10px;
  background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(135deg, var(--accent), var(--accent2)) border-box;
  box-shadow: 0 30px 80px rgba(0,0,0,.55); overflow: hidden; animation: pop .16s cubic-bezier(.2,.8,.2,1);
}
@keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.98); } }

.pal .q span { color: var(--accent); font-weight: 800; }

.pal .list { max-height: 50vh; overflow: auto; padding: 6px; }

.pal .it .icon { width: 18px; height: 18px; color: var(--accent); }

.pal .it.sel .k { color: var(--muted); }
.pal .crumbs { padding: 6px 14px; font-size: 11px; color: var(--faint); border-bottom: 1px solid var(--border); }

.keys { width: 760px; max-width: calc(100vw - 32px); max-height: 76vh; overflow: auto; padding: 16px 18px; }

/* Lock screen (deadlock) */
.lock { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: color-mix(in srgb, var(--bg) 55%, transparent); backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px); animation: fade .3s; }
.lock .time { font-size: clamp(64px, 12vw, 140px); font-weight: 800; letter-spacing: -.04em; line-height: 1; background: linear-gradient(135deg, var(--fg), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }

.lock img { width: 64px; height: 64px; }
.lock input { width: 300px; max-width: 80vw; text-align: center; padding: 10px 14px; border-radius: 999px; background: color-mix(in srgb, var(--surface) 80%, transparent); border: 2px solid var(--accent); outline: none; color: var(--fg); font-size: 14px; }
.lock .msg { min-height: 20px; color: var(--muted); font-size: 12px; max-width: 420px; text-align: center; }

.kiln, .boot, .halt { background: #000; color: #d6d6d6; cursor: none; }

.halt .big { font-size: 20px; color: #ffb000; }
.halt button { background: none; border: 1px solid #444; color: #aaa; padding: 6px 12px; border-radius: 6px; cursor: pointer; }

/* Phones and narrow windows: one window at a time */
@media (max-width: 720px) {
  #bar { grid-template-columns: auto 1fr auto; }
  #bar .hide-narrow { display: none; }
  #notes { width: calc(100vw - 20px); }

// The OS namespace: events, DOM helper, maths, storage, sound, icons, app registry.
const OS = (() => {
  const handlers = {};
  const params = new URLSearchParams(location.search);

  const os = {
    version: '2.0',
    codename: 'Composed',
    build: '2026.11.13-not-worse-than-main',
    apps: {},
    params,
    speed: Math.max(0.1, Math.min(50, Number(params.get('speed')) || 1)),
    ready: false,
  };

  // ---------- events ----------
  os.on = (evt, fn) => { (handlers[evt] ||= new Set()).add(fn); return () => handlers[evt].delete(fn); };
  os.off = (evt, fn) => handlers[evt]?.delete(fn);
  os.emit = (evt, data) => {
    for (const fn of [...(handlers[evt] || [])]) {
      try { fn(data); } catch (err) { console.error(`[OS] handler for '${evt}' threw`, err); }
    }
  };

  // ---------- DOM ----------
  // h('div', {class: 'x', onclick: fn, style: {color: 'red'}}, 'text', child, [more])
  os.h = (tag, attrs, ...kids) => {
    const el = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'text') el.textContent = v;
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (k in el && typeof v !== 'string') el[k] = v;
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    const add = (k) => {
      if (k == null || k === false) return;
      if (Array.isArray(k)) k.forEach(add);
      else el.append(k instanceof Node ? k : document.createTextNode(String(k)));
    };
    kids.forEach(add);
    return el;

  os.esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- maths ----------
  os.hash = (str) => {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return h >>> 0;
  };
  os.rng = (seed) => {

  os.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  os.lerp = (a, b, t) => a + (b - a) * t;
  os.money = (n) => (n < 0 ? '-£' : '£') + Math.round(Math.abs(n)).toLocaleString('en-GB');
  os.usd = (n) => (n < 0 ? '-$' : '$') + Math.abs(n).toFixed(2);
  os.pad = (s, n, ch = ' ') => String(s).padEnd(n, ch).slice(0, Math.max(n, String(s).length));

  // ---------- time ----------
  // A day offset lets the spend ledger "wait until tomorrow".
  os.dayOffset = 0;

    set(key, val) {

      if (!t) return false;
      current = t; OS.store.set('theme', name); apply();
      OS.emit('theme', current);
      return true;
    },
    next(step = 1) {
      const i = themes.indexOf(current);
      this.set(themes[(i + step + themes.length) % themes.length].name);
      return current;
    },
    wallpapers: ['aurora', 'ridges', 'heightmap', 'blueprint', 'hazard', 'bricky'],
    wallpaper: () => wallpaper || current.wall,

    nextWallpaper() {
      const list = this.wallpapers; const i = list.indexOf(this.wallpaper());
      this.setWallpaper(list[(i + 1) % list.length]);
      return this.wallpaper();
    },
    // Mix two hex colours: t=0 gives a, t=1 gives b.
    mix(a, b, t) {
      const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
      const [x, y] = [p(a), p(b)];
      return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');
    },

// A small in-memory POSIX-ish filesystem. Writes persist to localStorage as an overlay.
(() => {
  const HOME = '/home/researcher';
  const now = () => OS.now().getTime();
  const mkdirNode = () => ({ type: 'dir', kids: new Map(), mtime: now() });
  const mkfileNode = (content) => ({ type: 'file', content, mtime: now() });
  const root = mkdirNode();
  let overlay = OS.store.get('fs', {});
  const PROTECTED = {
    '/': 'rm: refusing to remove \'/\'. Bricky is standing on it.',
    [HOME]: 'rm: refusing to remove your own home. You would have nowhere to extend.',
    '/gold': 'rm: /gold is gold. Gold is never edited, only overridden.',
    '/gold/houses': 'rm: the reliable four (158, 152, 135, 178) cannot be removed. They are the reliable four.',
  };

  const err = (code, msg) => { const e = new Error(msg); e.code = code; return e; };

  function resolve(cwd, p) {
    if (p == null || p === '') return cwd || HOME;
    if (p === '~' || p.startsWith('~/')) p = HOME + p.slice(1);
    else if (!p.startsWith('/')) p = (cwd || HOME) + '/' + p;
    const out = [];
    for (const part of p.split('/')) {
      if (!part || part === '.') continue;
      if (part === '..') out.pop(); else out.push(part);
    }
    return '/' + out.join('/');
  }
  const parts = (p) => resolve('/', p).split('/').filter(Boolean);
  const dirname = (p) => { const a = parts(p); a.pop(); return '/' + a.join('/'); };
  const basename = (p) => parts(p).pop() || '/';

  function node(p) {
    let n = root;
    for (const part of parts(p)) {
      if (n.type !== 'dir') return null;
      n = n.kids.get(part);
      if (!n) return null;
    }
    return n;
  }

  function ensureDir(p) {
    let n = root;
    for (const part of parts(p)) {
      let k = n.kids.get(part);
      if (!k) { k = mkdirNode(); n.kids.set(part, k); }
      if (k.type !== 'dir') throw err('ENOTDIR', `${p}: Not a directory`);
      n = k;
    }
    return n;
  }

  function save() { OS.store.set('fs', overlay); }

  const fs = {
    home: HOME,
    resolve,
    dirname,
    basename,
    stat: (p) => node(p),
    exists: (p) => !!node(p),
    isDir: (p) => node(p)?.type === 'dir',
    isFile: (p) => node(p)?.type === 'file',
    read(p) {
      const n = node(p);
      if (!n) throw err('ENOENT', `${p}: No such file or directory`);
      if (n.type === 'dir') throw err('EISDIR', `${p}: Is a directory`);
      return typeof n.content === 'function' ? String(n.content()) : n.content;
    },
    write(p, content, { persist = true } = {}) {
      p = resolve('/', p);
      const parent = node(dirname(p));
      if (!parent || parent.type !== 'dir') throw err('ENOENT', `${dirname(p)}: No such file or directory`);
      const existing = parent.kids.get(basename(p));
      if (existing?.type === 'dir') throw err('EISDIR', `${p}: Is a directory`);
      parent.kids.set(basename(p), mkfileNode(String(content)));
      if (persist) { overlay[p] = String(content); save(); }
      OS.emit('fs', { path: p, op: 'write' });
    },
    mkdir(p, { parents = false, persist = true } = {}) {
      p = resolve('/', p);
      if (node(p)) { if (parents) return; throw err('EEXIST', `${p}: File exists`); }
      if (!parents && !fs.isDir(dirname(p))) throw err('ENOENT', `${dirname(p)}: No such file or directory`);
      ensureDir(p);
      if (persist) { overlay[p + '/'] = ''; save(); }
    },
    rm(p, { recursive = false, persist = true } = {}) {
      p = resolve('/', p);
      if (PROTECTED[p]) throw err('EPERM', PROTECTED[p]);
      const n = node(p);
      if (!n) throw err('ENOENT', `${p}: No such file or directory`);
      if (n.type === 'dir' && !recursive) throw err('EISDIR', `${p}: Is a directory`);
      node(dirname(p)).kids.delete(basename(p));
      if (persist) {
        for (const k of Object.keys(overlay)) if (k === p || k.startsWith(p + '/')) delete overlay[k];
        overlay[p] = null; save();
      }
      OS.emit('fs', { path: p, op: 'rm' });
    },
    ls(p) {
      const n = node(p);
      if (!n) throw err('ENOENT', `${p}: No such file or directory`);
      if (n.type === 'file') return [{ name: basename(p), type: 'file', size: fs.read(p).length, mtime: n.mtime }];
      return [...n.kids.entries()].sort(([a], [b]) => a.localeCompare(b)).map(([name, k]) => ({
        name, type: k.type, mtime: k.mtime,
        size: k.type === 'file' ? (typeof k.content === 'function' ? 0 : k.content.length) : k.kids.size,
      }));
    },
    // Every path under p (depth first), p excluded.
    walk(p) {
      const out = [];
      const go = (dir, path) => {
        for (const [name, k] of [...dir.kids.entries()].sort(([a], [b]) => a.localeCompare(b))) {
          const full = (path === '/' ? '' : path) + '/' + name;
          out.push(full);
          if (k.type === 'dir') go(k, full);
        }
      };
      const n = node(p);
      if (n?.type === 'dir') go(n, resolve('/', p));
      return out;
    },
    // Add files without persisting them: {'/abs/path': 'text' | () => 'text', '/abs/dir/': ''}
    seed(map) {
      for (const [p, content] of Object.entries(map)) {
        if (p.endsWith('/')) { ensureDir(p); continue; }
        ensureDir(dirname(p)).kids.set(basename(p), mkfileNode(content));
      }
    },
    // Throw away every saved change.
    reset() { overlay = {}; save(); },
  };

    '/etc/motd': 'Welcome to Labs OS 2.0 (Composed).\nThe daily spend cap is $100.00 (UTC). The note cap is $10.00.\nRun `help` for commands. Run `brickfetch` to feel something.\n',
    '/etc/hostname': 'labs\n',
    '/etc/brickland/brickland.conf': [
      '# brickland.conf: the compositor. SUPER is Alt (Option on a Mac). Browsers keep the real Super key.',
      'general {', '  gaps_in = 6', '  gaps_out = 10', '  border_size = 2', '  col.active_border = $accent $accent2 135deg',
      '  layout = dwindle   # dwindle | master | monocle', '}', '',
      'bind = SUPER, SPACE, exec, surveyor            # app launcher', 'bind = SUPER, RETURN, exec, brickty            # terminal',
      'bind = SUPER, W, killactive', 'bind = SUPER, F, fullscreen', 'bind = SUPER, T, togglefloating',
      'bind = SUPER, M, cyclelayout', 'bind = SUPER, 1..9, workspace, 1..9', 'bind = SUPER SHIFT, 1..9, movetoworkspace, 1..9',
      'bind = SUPER, H/J/K/L or arrows, movefocus', 'bind = SUPER SHIFT, H/J/K/L or arrows, swapwindow',
      'bind = SUPER SHIFT, SPACE, exec, labs-menu', 'bind = SUPER, ESCAPE, exec, deadlock', 'bind = SUPER, SLASH, exec, keybindings',

// ---- kernel/05_spend.js
// The spend ledger. Every app that "thinks" pays for it here. One daily cap, in UTC, like the real one.
(() => {
  const load = () => {
    const s = OS.store.get('spend', null);
    return s && s.day === OS.today() ? s : { day: OS.today(), usd: 0, tokens: 0, rows: [] };
  };
  let state = load();

  const save = () => OS.store.set('spend', state);
  const roll = () => { if (state.day !== OS.today()) { state = { day: OS.today(), usd: 0, tokens: 0, rows: [] }; save(); OS.emit('spend', OS.spend.summary()); } };

  OS.spend = {
    cap: OS.data.dailyCapUsd,
    today() { roll(); return state.usd; },
    tokens() { roll(); return state.tokens; },
    remaining() { return Math.max(0, this.cap - this.today()); },
    can(usd) { return this.today() + usd <= this.cap + 1e-9; },
    rows() { roll(); return state.rows.slice(); },
    summary() { return { day: state.day, usd: state.usd, tokens: state.tokens, cap: this.cap, remaining: this.remaining() }; },
    // Charge usd for label. Refuses (ok: false) when the charge would pass the daily cap.
    add(usd, label = 'unlabelled thinking', source = 'unknown', tokens = Math.round(usd * 52000)) {
      roll();
      if (!this.can(usd)) {
        const msg = `Today's spend is ${OS.usd(state.usd)} of the ${OS.usd(this.cap)} daily cap (UTC). Conclude your current experiment and stop until tomorrow.`;
        OS.emit('spend:cap', { usd, label, source, message: msg });
        return { ok: false, message: msg, ...this.summary() };
      }
      state.usd = Math.round((state.usd + usd) * 10000) / 10000;
      state.tokens += tokens;
      state.rows.unshift({ t: OS.now().toISOString().slice(11, 19), usd, label, source, tokens });
      state.rows.length = Math.min(state.rows.length, 200);
      save();
      OS.emit('spend', this.summary());
      return { ok: true, ...this.summary() };
    },
    // "Wait until tomorrow": moves the OS clock on one day. The cap resets. Nothing else does.
    tomorrow() {
      OS.dayOffset += 1;
      roll();
      OS.emit('spend', this.summary());
      return this.summary();
    },
  };
})();

// Shell command registry. The terminal app runs these; any app may add its own.
(() => {
  const cmds = new Map();
  const aliases = new Map();

  OS.commands = {
    // spec: {desc, usage, hidden, run(args, io) -> exit code | Promise, complete(args) -> [strings]}
    register(name, spec) {
      if (!name || typeof spec?.run !== 'function') { console.error('[OS] commands.register needs (name, {run})'); return; }
      if (cmds.has(name)) console.warn(`[OS] command '${name}' registered twice; the second one wins`);
      cmds.set(name, { name, desc: '', usage: name, hidden: false, ...spec });
    },
    alias(name, target) { aliases.set(name, target); },
    get(name) {
      const n = name.replace(/^\.\//, '');
      const key = cmds.has(n) ? n : aliases.get(n);
      return key ? cmds.get(key) : null;
    },
    list() { return [...cmds.values()].filter((c) => !c.hidden).sort((a, b) => a.name.localeCompare(b.name)); },
    names() { return [...cmds.keys(), ...aliases.keys()].sort(); },
  };

  // Open a terminal and run a command line in it. Used by the launcher (">" prefix) and the Labs menu.
  OS.exec = (line) => OS.open('terminal', { run: line });

  // Split a command line into words. Handles 'single' and "double" quotes.
  OS.parseArgs = (line) => {
    const out = []; let cur = ''; let q = null; let any = false;
    for (const ch of line) {
      if (q) { if (ch === q) q = null; else cur += ch; continue; }
      if (ch === '"' || ch === "'") { q = ch; any = true; continue; }
      if (/\s/.test(ch)) { if (cur || any) { out.push(cur); cur = ''; any = false; } continue; }
      cur += ch;
    }
    if (cur || any) out.push(cur);
    return out;
  };
})();

// r3d: a tiny flat-shaded 3D renderer on a 2D canvas. Painter's algorithm, no library.

// mortar: notifications, the on-screen display, the crash panel, and Bricky's voice.
(() => {
  const { h } = OS;
  const box = document.getElementById('notes');
  const history = [];
  let dnd = OS.store.get('dnd', false);

  // OS.notify({title, body, app, icon, urgency: 'low'|'normal'|'critical', timeout, actions: [{label, run}], bricky})
  OS.notify = (n) => {
    const note = { app: 'labs', urgency: 'normal', timeout: 6500, ...n, at: OS.now() };
    history.unshift(note); history.length = Math.min(history.length, 60);
    OS.emit('notify', note);
    if (dnd && note.urgency !== 'critical') return note;
    const av = note.bricky || (!note.icon && note.app === 'bricky')
      ? h('img', { class: 'pixel', src: OS.bricky(), alt: '' })
      : h('span', { html: OS.icon(note.icon || 'bell') }).firstChild;
    const life = h('div', { class: 'life' });
    const el = h('div', { class: `note ${note.urgency}`, role: 'status' },
      h('div', { class: 'av' }, av),
      h('div', null,
        h('div', { class: 'ap' }, note.app),
        h('div', { class: 'tt' }, note.title || ''),
        note.body ? h('div', { class: 'bd' }, Array.isArray(note.body) ? note.body.join('\n') : note.body) : null,
        note.actions?.length ? h('div', { class: 'acts' }, note.actions.map((a) => h('button', { class: 'ui-btn', onclick: (e) => { e.stopPropagation(); try { a.run(); } finally { dismiss(); } } }, a.label))) : null,
      ),
      life,
    );
    let gone = false;
    const dismiss = () => { if (gone) return; gone = true; el.classList.add('out'); setTimeout(() => el.remove(), 240); };
    el.addEventListener('click', dismiss);
    box.prepend(el);
    while (box.children.length > 4) box.lastChild.remove();
    if (note.urgency !== 'critical' && note.timeout > 0) {
      life.animate([{ width: '100%' }, { width: '0%' }], { duration: note.timeout / OS.speed, easing: 'linear' });
      setTimeout(dismiss, note.timeout / OS.speed);
    }
    if (note.urgency === 'critical') OS.sound.error(); else OS.sound.ding();
    return note;
  };

    history: () => history.slice(),
    dnd: () => dnd,
    setDnd(v) { dnd = !!v; OS.store.set('dnd', dnd); OS.emit('notify', null); },
    clear() { box.innerHTML = ''; },
  };

  OS.osd = (text) => {
    if (!osdEl) {
      osdEl = h('div', { style: { position: 'absolute', left: '50%', bottom: '12%', transform: 'translateX(-50%)', zIndex: 70, padding: '8px 16px', borderRadius: '999px', background: 'var(--surface)', border: '2px solid var(--accent)', fontWeight: 800, pointerEvents: 'none', transition: 'opacity .25s', boxShadow: '0 10px 30px rgba(0,0,0,.4)' } });
      document.getElementById('os').append(osdEl);
    }

    clearTimeout(osdT); osdT = setTimeout(() => { osdEl.style.opacity = '0'; }, 1100);
  };

  // spec: {title, code, lines: [], details: [], icon, actions: [{label, run, primary}]}
  OS.crash = (win, spec = {}) => {
    const panel = h('div', { class: 'ui-crash' });
    const close = () => panel.remove();
    const actions = spec.actions?.length ? spec.actions : [{ label: 'OK', primary: true, run: close }, { label: 'Close app', run: () => win.close() }];
    panel.append(h('div', { class: 'box' },
      h('div', { class: 'hd' }, h('span', { html: OS.icon(spec.icon || 'status-error') }).firstChild, spec.title || 'Something went wrong on purpose'),
      h('div', { class: 'bd' },
        (spec.lines || []).map((l) => h('div', null, l)),
        spec.code ? h('div', { class: 'code' }, spec.code) : null,
        spec.details?.length ? h('pre', null, spec.details.join('\n')) : null,
      ),
      h('div', { class: 'ft' }, actions.map((a) => h('button', { class: 'ui-btn' + (a.primary ? ' primary' : ''), onclick: () => { const keep = a.run?.(); if (keep !== true) close(); } }, a.label))),

})();

(() => {
  const { h, esc } = OS;
  const root = document.getElementById('overlay');
  let current = null;

  OS.overlayOpen = () => !!current;
  function closeOverlay() {
    if (!current) return;

  function fuzzy(q, text) {
    if (!q) return { score: 0, hits: [] };
    const t = text.toLowerCase(); const s = q.toLowerCase();
    let ti = 0; let score = 0; let prev = -2; const hits = [];
    for (const ch of s) {
      const i = t.indexOf(ch, ti);
      if (i < 0) return null;
      score += 1 + (i === prev + 1 ? 3 : 0) + (i === 0 || /[\s_\-./]/.test(t[i - 1]) ? 2 : 0);

  }

    const set = new Set(hits); let out = '';
    [...text].forEach((ch, i) => { out += set.has(i) ? `<mark>${esc(ch)}</mark>` : esc(ch); });
    return out;
  };

  function palette({ placeholder, prompt = '›', source, foot, crumbs: rootCrumb = [] }) {
    const stack = [...rootCrumb];
    const input = h('input', { placeholder, spellcheck: false, autocomplete: 'off', 'aria-label': placeholder });
    const list = h('div', { class: 'list', role: 'listbox' });
    const crumbs = h('div', { class: 'crumbs' });
    const pal = h('div', { class: 'pal', role: 'dialog' },
      h('div', { class: 'q' }, h('span', null, prompt), input), crumbs, list,
      foot ? h('div', { class: 'foot', html: foot }) : null);

      items.forEach((it, i) => {

          h('span', { html: OS.icon(it.icon || 'question') }).firstChild,
          h('div', { style: { minWidth: 0 } }, h('div', { class: 'n', html: mark(it.name, it.hits || []) }), it.desc ? h('div', { class: 'd' }, it.desc) : null),

          const xx = r.x + r.w / 2;
          ctx.moveTo(xx, r.y + i); ctx.lineTo(xx, r.y + r.h - i);
          [[r.x, r.y], [r.x + r.w, r.y]].forEach(([px, py]) => { ctx.moveTo(px, py); ctx.lineTo(xx, r.y + i); });
          [[r.x, r.y + r.h], [r.x + r.w, r.y + r.h]].forEach(([px, py]) => { ctx.moveTo(px, py); ctx.lineTo(xx, r.y + r.h - i); });
        }
        ctx.stroke();
      }
      ctx.fillStyle = th.muted + '88'; ctx.font = `${10 * s}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.fillText('ridge, hip and valley lines (formerly contour lines)', 16 * s, H - 40 * s);
    },
    heightmap(W, H, th, s, rnd) {
      // Black is low (eaves), white is high (ridge). Drawn small, scaled up without smoothing.
      const k = 4 * s; const w = Math.ceil(W / k); const hgt = Math.ceil(H / k);
      const img = ctx.createImageData(w, hgt);
      const rects = streets(w, hgt, rnd, 1 / k * s * 1.4);
      for (const r of rects) {
        for (let y = Math.max(0, Math.floor(r.y)); y < Math.min(hgt, r.y + r.h); y++) {
          for (let x = Math.max(0, Math.floor(r.x)); x < Math.min(w, r.x + r.w); x++) {
            const d = Math.min(x - r.x, r.x + r.w - x, y - r.y, r.y + r.h - y);
            const v = Math.round(40 + 215 * Math.min(1, d / (Math.min(r.w, r.h) / 2)));
            const o = (y * w + x) * 4; img.data[o] = img.data[o + 1] = img.data[o + 2] = v; img.data[o + 3] = 255;
          }
        }
      }
      const tmp = document.createElement('canvas'); tmp.width = w; tmp.height = hgt; tmp.getContext('2d').putImageData(img, 0, 0);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      ctx.imageSmoothingEnabled = false; ctx.globalAlpha = th.name === 'heightmap' ? 0.55 : 0.32;
      ctx.drawImage(tmp, 0, 0, w * k, hgt * k); ctx.globalAlpha = 1; ctx.imageSmoothingEnabled = true;
      ctx.fillStyle = '#ffffffaa'; ctx.font = `${10 * s}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.fillText('black is low · white is high · no exceptions', 16 * s, H - 40 * s);
    },
    blueprint(W, H, th, s) {
      ctx.fillStyle = th.bg; ctx.fillRect(0, 0, W, H);
      const minor = 12 * s; // 0.5 m
      ctx.lineWidth = s;
      for (let x = 0; x < W; x += minor) { ctx.strokeStyle = (Math.round(x / minor) % 10 === 0) ? th.accent + '40' : th.accent + '16'; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y < H; y += minor) { ctx.strokeStyle = (Math.round(y / minor) % 10 === 0) ? th.accent + '40' : th.accent + '16'; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
      // A plan: house 6 x 8 m, rear extension 3 m wide (always 3 m), depth 4.5 m
      const ox = Math.round(W * 0.58 / minor) * minor; const oy = Math.round(H * 0.22 / minor) * minor;
      const m = minor * 2;
      ctx.strokeStyle = th.accent2 + 'cc'; ctx.lineWidth = 3 * s;
      ctx.strokeRect(ox, oy, 6 * m, 8 * m);
      ctx.strokeRect(ox, oy + 8 * m, 3 * m, 4.5 * m);
      ctx.lineWidth = 1.5 * s; ctx.strokeStyle = th.accent2 + '88';
      ctx.beginPath(); ctx.moveTo(ox, oy + 4 * m); ctx.lineTo(ox + 6 * m, oy + 4 * m); ctx.moveTo(ox + 3 * m, oy); ctx.lineTo(ox + 3 * m, oy + 4 * m); ctx.stroke();
      ctx.beginPath(); ctx.arc(ox + 3 * m, oy + 8 * m, m * 0.9, Math.PI, Math.PI * 1.5); ctx.stroke();
      ctx.fillStyle = th.accent2 + 'cc'; ctx.font = `${11 * s}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.fillText('3 × 4.5m', ox + 3.2 * m, oy + 10.4 * m);
      ctx.fillText('(width is always 3)', ox + 3.2 * m, oy + 10.4 * m + 14 * s);
      ctx.fillText('GROUND FLOOR (0)', ox, oy - 10 * s);
      ctx.beginPath(); ctx.moveTo(ox - 2 * m, oy + 2 * m); ctx.lineTo(ox - 2 * m, oy); ctx.lineTo(ox - 2.3 * m, oy + 0.6 * m); ctx.stroke();
      ctx.fillText('N', ox - 2.2 * m, oy - 6 * s);
    },
    hazard(W, H, th, s) {
      ctx.fillStyle = th.bg; ctx.fillRect(0, 0, W, H);
      const band = 34 * s;
      for (const y0 of [H - band * 2.2]) {
        ctx.save(); ctx.beginPath(); ctx.rect(0, y0, W, band); ctx.clip();
        for (let x = -band * 2; x < W + band * 2; x += band) { ctx.fillStyle = (Math.round(x / band) % 2) ? th.accent + 'cc' : '#00000000'; ctx.beginPath(); ctx.moveTo(x, y0 + band); ctx.lineTo(x + band, y0); ctx.lineTo(x + band * 1.6, y0); ctx.lineTo(x + band * 0.6, y0 + band); ctx.fill(); }
        ctx.restore();
      }
      ctx.fillStyle = th.accent + '22'; ctx.font = `800 ${Math.round(W / 14)}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.textAlign = 'center'; ctx.fillText('SKIP HIRE', W / 2, H / 2); ctx.textAlign = 'left';
      ctx.fillStyle = th.accent + '66'; ctx.font = `${12 * s}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.textAlign = 'center'; ctx.fillText('permit valid for 28 days · do not overfill · no plasterboard', W / 2, H / 2 + 30 * s); ctx.textAlign = 'left';
    },
    bricky(W, H, th, s) {
      ctx.fillStyle = th.bg; ctx.fillRect(0, 0, W, H);
      // running bond, 215 x 65 mm with 10 mm joints, drawn large
      const bw = 64 * s; const bh = 22 * s;
      ctx.strokeStyle = th.fg + '0d'; ctx.lineWidth = s;
      for (let r = 0, y = 0; y < H; r++, y += bh) {
        for (let x = (r % 2 ? -bw / 2 : 0); x < W; x += bw) ctx.strokeRect(x + 0.5, y + 0.5, bw, bh);
      }
      if (brickyImg.complete && brickyImg.naturalWidth) {
        const size = Math.min(W, H) * 0.5; ctx.imageSmoothingEnabled = false; ctx.globalAlpha = 0.16;
        ctx.drawImage(brickyImg, (W - size) / 2, (H - size) / 2, size, size); ctx.globalAlpha = 1; ctx.imageSmoothingEnabled = true;
      }
    },
  };

  function draw() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = Math.round(canvas.clientWidth * dpr); const H = Math.round(canvas.clientHeight * dpr);
    if (!W || !H) return;
    canvas.width = W; canvas.height = H;
    const th = OS.theme.colors();
    const name = OS.theme.wallpaper();
    const rnd = OS.rng('wallpaper:' + name + ':' + Math.round(W / 200));
    (painters[name] || painters.aurora)(W, H, th, dpr, rnd);
    // watermark, a nod to 3.1's licence lines
    ctx.font = `${10 * dpr}px ${getComputedStyle(document.body).fontFamily}`;
    ctx.fillStyle = th.faint; ctx.textAlign = 'right';
    ctx.fillText('Labs OS 2.0 (Composed)', W - 14 * dpr, H - 34 * dpr);
    ctx.fillText('This copy of Labs OS is not worse than main.', W - 14 * dpr, H - 20 * dpr);
    ctx.textAlign = 'left';
  }

  let t = 0;
  window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(draw, 120); });
  OS.on('theme', draw); OS.on('wallpaper', draw);
  OS.wallpaper = { draw, names: Object.keys(painters) };
})();

// ---- kernel/14_keys.js
// Global key bindings. SUPER is Alt: browsers keep the real Super key for themselves.
(() => {
  const editable = (el) => !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
  const dirs = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', KeyH: 'left', KeyL: 'right', KeyK: 'up', KeyJ: 'down' };

  OS.keybindings = [
    ['Alt+Space', 'Launcher (surveyor)'], ['Ctrl+K', 'Launcher again, as the command palette'],
    ['Alt+Enter', 'Terminal (brickty)'], ['Alt+Shift+Space', 'Labs menu'],
    ['Alt+W', 'Close window'], ['Alt+F', 'Fullscreen'], ['Alt+T', 'Float or tile'], ['Alt+M', 'Cycle layout: dwindle, master, monocle'],
    ['Alt+1..9', 'Go to workspace'], ['Alt+Shift+1..9', 'Move window to workspace'],
    ['Alt+H J K L', 'Focus left, down, up, right (arrows work too)'], ['Alt+Shift+H J K L', 'Swap with the window in that direction'],
    ['Alt+Ctrl+← →', 'Resize the first split'], ['Alt+Esc', 'Lock (deadlock)'],
    ['Alt+/', 'This sheet'], ['Alt+N', 'Notifications'], ['Alt+B', 'Bricky says a thing'],
    ['Alt+Shift+T', 'Next theme'], ['Alt+Shift+W', 'Next wallpaper'],
    ['Alt+Shift+C', 'Composer'], ['Alt+Shift+V', 'Configurator'], ['Alt+Shift+M', 'lanetop'], ['Alt+E', 'labvim'],
    ['Drag a title bar', 'Swap tiles, or move a floating window'], ['Double-click a title bar', 'Fullscreen'],
  ];

  function binding(e) {
    const f = OS.wm.focused();
    const shift = e.shiftKey; const ctrl = e.ctrlKey;
    if (ctrl && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) { OS.wm.resize(e.code === 'ArrowLeft' ? -0.05 : 0.05); return true; }
    if (ctrl) return false;
    if (e.code === 'Space') { if (shift) OS.ui.menu(); else OS.ui.launcher(); return true; }
    if (e.code === 'Enter') { OS.open('terminal', undefined, { float: shift }); return true; }
    if (e.code.startsWith('Digit') && e.code !== 'Digit0') {
      const n = Number(e.code.slice(5));
      if (shift) OS.wm.moveToWs(f, n); else OS.wm.switchWs(n);
      return true;
    }
    if (dirs[e.code]) { if (shift) OS.wm.swapDir(dirs[e.code]); else OS.wm.focusDir(dirs[e.code]); return true; }
    switch (e.code) {
      case 'KeyW': if (shift) { OS.theme.nextWallpaper(); OS.osd('wallpaper: ' + OS.theme.wallpaper()); } else f?.close(); return true;
      case 'KeyQ': f?.close(); return true;
      case 'KeyF': OS.wm.toggleFull(f); return true;
      case 'KeyT': if (shift) { OS.theme.next(); OS.osd('theme: ' + OS.theme.get().label); } else OS.wm.toggleFloat(f); return true;
      case 'KeyM': if (shift) OS.open('lanetop'); else OS.wm.cycleLayout(); return true;
      case 'KeyC': if (shift) { OS.open('composer'); return true; } return false;
      case 'KeyV': if (shift) { OS.open('configurator'); return true; } return false;
      case 'KeyE': OS.open('labvim'); return true;
      case 'KeyB': OS.brickySay(); return true;
      case 'KeyN': OS.ui.notifications(); return true;
      case 'Escape': OS.lock(); return true;
      case 'Slash': OS.ui.keys(); return true;
      default: return false;
    }
  }

  window.addEventListener('keydown', (e) => {
    if (OS.sessionOpen()) { if (OS.sessionKey(e)) { e.preventDefault(); e.stopPropagation(); } return; }
    if (!OS.ready) return;
    if (OS.overlayOpen()) { if (OS.overlayKey(e)) { e.preventDefault(); e.stopPropagation(); } return; }
    if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && e.code === 'KeyK') { e.preventDefault(); OS.ui.launcher(); return; }
    if (e.altKey && !e.metaKey && binding(e)) { e.preventDefault(); e.stopPropagation(); return; }
    const f = OS.wm.focused();
    if (f && !editable(document.activeElement)) {
      f.emit('key', e);
      try { f.app.onKey?.(f, e); } catch (err) { console.error(err); }
    }
  }, true);
})();

// ---- apps/00_system.js
// System apps that ship with the kernel: Style, About, Brine (runs Labs OS 3.1).
(() => {
  const { h } = OS;

  registerApp({
    id: 'style', title: 'Style', icon: 'paint-brush', desc: 'Themes, wallpapers and gaps', keywords: ['theme', 'wallpaper', 'settings', 'colours'],
    size: [760, 520],
    mount(win) {
      win.body.classList.add('ui-pad');
      const render = () => {
        win.body.innerHTML = '';
        const cur = OS.theme.get();
        const cards = OS.theme.list().map((t) => h('button', {
          class: 'ui-btn' + (t === cur ? ' on' : ''),
          style: { display: 'block', textAlign: 'left', padding: '0', overflow: 'hidden', whiteSpace: 'normal', height: 'auto' },
          onclick: () => { OS.theme.set(t.name); render(); },
        },
        h('div', { style: { background: t.bg, padding: '10px', borderBottom: `2px solid ${t.accent}` } },
          h('div', { style: { display: 'flex', gap: '4px', marginBottom: '8px' } }, [t.accent, t.accent2, t.good, t.bad, t.warn, t.info].map((c) => h('i', { style: { width: '14px', height: '14px', borderRadius: '3px', background: c, display: 'block' } }))),
          h('div', { style: { color: t.fg, fontWeight: 800 } }, t.label),
          h('div', { style: { color: t.muted, fontSize: '11px' } }, 'brickty ~ $ ', h('span', { style: { color: t.accent } }, 'bin/composer run 158'))),
        h('div', { style: { padding: '8px 10px', fontSize: '11px', color: 'var(--muted)' } }, t.blurb)));
        win.body.append(
          h('div', { class: 'ui-title' }, 'Theme'),
          h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))', gap: '10px', margin: '8px 0 16px' } }, cards),
          h('div', { class: 'ui-title' }, 'Wallpaper'),
          h('div', { class: 'row', style: { flexWrap: 'wrap', margin: '8px 0 16px' } }, OS.theme.wallpapers.map((w) => h('button', { class: 'ui-btn' + (w === OS.theme.wallpaper() ? ' on' : ''), onclick: () => { OS.theme.setWallpaper(w); render(); } }, w))),
          h('div', { class: 'ui-title' }, 'Gaps'),
          h('div', { class: 'row', style: { flexWrap: 'wrap', margin: '8px 0 16px' } }, [['Tight', 3, 6], ['Normal', 6, 10], ['Generous', 12, 22], ['None', 0, 0]].map(([n, i, o]) => h('button', { class: 'ui-btn' + (OS.wm.cfg.gapsIn === i && OS.wm.cfg.gapsOut === o ? ' on' : ''), onclick: () => { OS.wm.cfg.gapsIn = i; OS.wm.cfg.gapsOut = o; OS.store.set('gaps', [i, o]); for (let k = 1; k <= 9; k++) OS.wm.layout(k); render(); } }, `${n} ${i}/${o}`))),
          h('p', { class: 'ui-faint' }, 'Every theme was reviewed in five rounds. Round 6 is booked.'),
        );
      };
      render();
      win.state.off = OS.on('theme', render);
    },
    unmount(win) { win.state.off?.(); },
  });

  registerApp({
    id: 'about', title: 'About Labs OS', icon: 'labs', desc: 'Version, credits, what changed since 3.1', keywords: ['version', 'credits', 'help'],
    float: true, size: [560, 520],
    mount(win) {
      const rows = [
        ['Version', `Labs OS ${OS.version} (${OS.codename})`], ['Build', OS.build], ['Compositor', 'brickland (dwindle, master, monocle)'],
        ['Shell', 'brickty, with real commands and a fake disk'], ['Pipeline', `${OS.data.stages.length} stages, page codes P1 to M4`],
        ['Spend cap', `${OS.usd(OS.data.dailyCapUsd)} a day (UTC)`], ['Mascot', 'Bricky, 32x32, unupgraded by choice'],
        ['Previous version', '3.1 (Evaluation). 2.0 follows 3.1. Version numbers are display numbers.'],
      ];
      win.body.append(h('div', { class: 'ui-pad col', style: { gap: '12px' } },
        h('div', { class: 'row', style: { gap: '14px' } },
          h('div', { style: { width: '64px', height: '64px' }, html: OS.logoSvg }),
          h('div', null, h('div', { class: 'ui-big' }, 'Labs OS 2'), h('div', { class: 'ui-muted' }, 'Composed, not configured.'))),
        h('table', { class: 'ui-table' }, rows.map(([k, v]) => h('tr', null, h('td', { class: 'ui-muted' }, k), h('td', { style: { whiteSpace: 'normal' } }, v)))),
        h('div', { class: 'ui-title' }, 'New since 3.1'),
        h('ul', { style: { margin: 0, paddingLeft: '18px', color: 'var(--muted)' } },
          ['Windows tile now. Nobody drags them. Everybody drags them.', 'The 3D house is composed in 22 stages instead of drawn in one.',
            'Everything that thinks now costs money, and the bar shows how much.', 'The configurator has been through five design reviews and is booked for a sixth.',
            'Bricky was offered an upgrade. Bricky declined.', '3.1 still runs, through brine, in a window.'].map((t) => h('li', null, t))),
        h('div', { class: 'row' },
          h('button', { class: 'ui-btn', onclick: () => OS.ui.keys() }, 'Key bindings'),
          h('button', { class: 'ui-btn', onclick: () => OS.open('brine') }, 'Run 3.1'),
          h('button', { class: 'ui-btn primary', onclick: () => win.close() }, 'Close')),
      ));
    },
  });

  registerApp({
    id: 'brine', title: 'brine: Labs OS 3.1', icon: 'stonehenge', desc: 'Runs Labs OS 3.1 (Evaluation) in a compatibility layer', keywords: ['legacy', 'v1', 'windows', '1996', 'wine'],
    size: [960, 600],
    mount(win) {
      let html = '';
      try {
        const bin = atob(OS_ASSETS.legacy);
        html = new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
      } catch (err) {
        win.crash({ title: 'brine could not unpack 3.1', code: 'BRN-0x0031 LEGACY_UNREADABLE', lines: [String(err.message)] });
        return;
      }
      const frame = h('iframe', { title: 'Labs OS 3.1', sandbox: 'allow-scripts', style: { border: 0, width: '100%', height: '100%', display: 'block', background: '#232326' } });
      frame.srcdoc = html;
      const note = h('div', { style: { padding: '4px 10px', fontSize: '11px', color: 'var(--muted)', background: 'var(--surface2)', borderBottom: '1px solid var(--border)' } },
        'brine 9.0: Labs OS 3.1 in compatibility mode. Keys typed inside belong to 1996. Use the ✕ above, or click outside first, to get Alt back.');
      win.body.style.display = 'flex'; win.body.style.flexDirection = 'column';
      win.body.append(note, h('div', { class: 'grow' }, frame));
      win.setMeta('wine is a different thing');
    },
  });
})();

// ---- start.js
// Start: boot (unless ?boot=0), then open the first windows and say hello.
(() => {
  const p = OS.params;
  const first = (p.get('apps') ?? 'terminal,composer').split(',').map((s) => s.trim()).filter(Boolean);

  OS.startSession = () => {
    OS.ready = true;
    OS.wallpaper.draw();
    OS.bar.redraw();
    for (const id of first) {
      if (!OS.apps[id]) continue;
      OS.open(id, id === 'terminal' && !p.get('apps') ? { run: 'brickfetch' } : undefined);
    }
    OS.wm.updateEmpty();
    if (p.get('bricky') !== '0') {
      setTimeout(() => OS.notify({
        app: 'bricky', bricky: true, title: 'Welcome to Labs OS 2',
        body: 'SUPER is Alt. Alt+Space finds apps. Alt+/ shows every key. I am still 32 by 32.', timeout: 9000,
      }), 900 / OS.speed);
      OS.startBricky();
    }
    OS.emit('ready');
  };

  OS.wallpaper.draw();
  if (p.get('boot') === '0') {
    document.getElementById('os').classList.remove('booting');
    OS.startSession();
  } else {
    OS.boot(OS.startSession);
  }
})();
